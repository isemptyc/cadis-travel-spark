[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadis-travel-spark"
version = "0.1.13"
description = "Create semantic travel map presentations from local photo folders."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "Pillow>=10,<12.2",
]

[project.optional-dependencies]
cadis = [
  "cadis",
]

[project.scripts]
travelspark = "travelspark.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
